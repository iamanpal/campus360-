<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Results & Gradebook | Campus 360</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/portal.css">
</head>
<body class="portal-body">

  <aside class="portal-sidebar" id="portalSidebar"></aside>

  <div class="portal-main">
    <header class="portal-topbar" id="portalTopbar"></header>

    <main class="portal-content">
      <div class="portal-page-header">
        <h1 class="portal-page-title">Academic Results & Gradebook</h1>
        <p class="portal-page-subtitle">View semester-wise subject marks, maximum scores, and letter grades</p>
      </div>

      <!-- SEMESTER FILTER BUTTONS & GPA CARD -->
      <div class="card" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <strong style="color: var(--muted); font-size: 0.85rem; display: block; margin-bottom: 0.5rem;">Filter by Semester:</strong>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button class="filter-btn sem-filter-btn active" data-sem="All">All Semesters</button>
            <button class="filter-btn sem-filter-btn" data-sem="1">Semester 1</button>
            <button class="filter-btn sem-filter-btn" data-sem="2">Semester 2</button>
            <button class="filter-btn sem-filter-btn" data-sem="3">Semester 3</button>
            <button class="filter-btn sem-filter-btn" data-sem="4">Semester 4</button>
          </div>
        </div>

        <div style="text-align: right;">
          <span style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Overall Academic Average:</span>
          <h2 style="color: var(--maroon); margin-bottom: 0;" id="calculatedGpaDisplay">--%</h2>
        </div>
      </div>

      <!-- RESULTS TABLE -->
      <div class="card">
        <div class="table-responsive">
          <table class="portal-table">
            <thead>
              <tr>
                <th>Semester</th>
                <th>Subject Name</th>
                <th>Marks Obtained</th>
                <th>Maximum Marks</th>
                <th>Letter Grade</th>
              </tr>
            </thead>
            <tbody id="resultsTableBody">
              <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading results...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="footer-bottom" style="margin-top: auto;">
      <div class="container">
        <p>&copy; 2026 Campus 360. All rights reserved. Academic Results Module.</p>
      </div>
    </footer>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/student/results.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      protectPortal('student', 'results');
    });
  </script>
</body>
</html>
