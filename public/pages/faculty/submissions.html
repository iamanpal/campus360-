<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Submissions | Campus 360 Faculty</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/portal.css">
</head>
<body class="portal-body">

  <aside class="portal-sidebar" id="portalSidebar"></aside>

  <div class="portal-main">
    <header class="portal-topbar" id="portalTopbar"></header>

    <main class="portal-content">
      <div class="portal-page-header">
        <h1 class="portal-page-title">Student Submissions & Evaluation</h1>
        <p class="portal-page-subtitle">Review submitted work, record evaluation marks, and provide student feedback</p>
      </div>

      <div id="submissionsContainer">
        <p style="color: var(--muted); text-align: center; padding: 2rem;">Loading student submissions...</p>
      </div>
    </main>

    <!-- EVALUATION MODAL DIALOG (Anti-Congestion Refactor) -->
    <div id="evalModal" class="modal-overlay">
      <div class="modal-dialog-box">
        <div class="modal-dialog-header">
          <h3>Grade & Evaluate Submission</h3>
          <button type="button" onclick="closeEvaluateModal()" class="modal-close-btn" aria-label="Close">&times;</button>
        </div>

        <div style="background-color: var(--blush); border: 1px solid var(--soft-rose); border-radius: var(--radius-sm); padding: 0.85rem 1.25rem; margin-bottom: 1.25rem;">
          <span style="font-size: 0.82rem; color: var(--muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 0.2rem;">Student Profile</span>
          <span style="font-weight: 700; color: var(--maroon); font-size: 1.1rem;" id="evalStudentName">Student</span>
        </div>

        <!-- Student Submission Preview in Evaluation Modal -->
        <div id="evalSubmissionPreview" style="background: var(--white); border: 1px solid var(--soft-rose); border-radius: var(--radius-sm); padding: 0.85rem 1rem; margin-bottom: 1.25rem; max-height: 220px; overflow-y: auto;"></div>

        <div id="evalAlert" class="alert"></div>

        <form id="evalForm">
          <div class="modal-form-group">
            <label for="evalMarks">Marks Score (Max: <span id="evalMaxMarks">100</span>) *</label>
            <input type="number" id="evalMarks" class="form-control" placeholder="e.g. 92" min="0" required style="padding: 0.8rem 1rem; font-size: 1.05rem; font-weight: 600;">
          </div>

          <div class="modal-form-group">
            <label for="evalFeedback">Instructor Feedback & Constructive Comments</label>
            <textarea id="evalFeedback" class="modal-textarea" placeholder="Write feedback, recommendations or suggestions for this student..." style="min-height: 110px;"></textarea>
          </div>

          <div class="modal-action-row">
            <button type="button" onclick="closeEvaluateModal()" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save & Record Evaluation</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer-bottom" style="margin-top: auto;">
      <div class="container">
        <p>&copy; 2026 Campus 360. All rights reserved. Submission Evaluator Module.</p>
      </div>
    </footer>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/faculty/submissions.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      protectPortal('faculty', 'submissions');
    });
  </script>
</body>
</html>
