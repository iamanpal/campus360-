<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Results | Campus 360 Admin</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/portal.css">
</head>
<body class="portal-body">

  <aside class="portal-sidebar" id="portalSidebar"></aside>

  <div class="portal-main">
    <header class="portal-topbar" id="portalTopbar"></header>

    <main class="portal-content">
      <div class="portal-page-header">
        <h1 class="portal-page-title">Institutional Exam Results 🎓</h1>
        <p class="portal-page-subtitle">Master record of student grades and marks submitted by faculty members</p>
      </div>

      <!-- RESULTS TABLE CARD -->
      <div class="card">
        <h3 style="color: var(--dark-maroon); font-size: 1.2rem; margin-bottom: 1rem; border-bottom: 2px solid var(--blush); padding-bottom: 0.5rem;">
          📋 Student Examination Records
        </h3>

        <div id="adminResultsEmptyState" style="display: none; padding: 2rem; text-align: center; color: var(--muted);"></div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Student & Roll No</th>
                <th>Semester</th>
                <th>Subject Name</th>
                <th>Marks Obtained</th>
                <th>Grade</th>
                <th>Remarks</th>
              </tr>
            </thead>
            <tbody id="adminResultsTableBody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--muted); padding: 2rem;">Loading exam results...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="footer-bottom" style="margin-top: auto;">
      <div class="container">
        <p>&copy; 2026 Campus 360. All rights reserved. Admin Control Panel Module.</p>
      </div>
    </footer>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/admin/results.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      protectPortal('admin', 'results');
    });
  </script>
</body>
</html>
